services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    container_name: logstash
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - weblogs:/logs:ro
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  web:
    image: nginx:alpine
    container_name: nginx-web
    ports:
      - "8085:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - weblogs:/logs

  traffic:
    image: alpine:3.20
    container_name: traffic-gen
    depends_on:
      - web
    command:
      - sh
      - -c
      - |
        while true; do
          wget -q -O /dev/null http://web/ || true
          wget -q -O /dev/null http://web/index.html || true
          wget -q -O /dev/null http://web/about || true
          wget -q -O /dev/null http://web/missing || true
          wget -q -O /dev/null http://web/old || true
          wget -q -O /dev/null http://web/error || true
          sleep 2
        done

volumes:
  esdata:
  weblogs:
